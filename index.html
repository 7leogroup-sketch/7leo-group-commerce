<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Leo Group Commerce | Vision, Power, Legacy</title>
    
    <!-- PWA Manifest via Data URI -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"7Leo Group Commerce","short_name":"7Leo","start_url":"/","display":"standalone","background_color":"#0a0a0a","theme_color":"#00f2ff","icons":[{"src":"logo.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#00f2ff">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --white: #ffffff;
            --neon-blue: #00f2ff;
            --red: #ff003c;
            --orange: #ff9900;
            --grey: #808080;
            --glass: rgba(255, 255, 255, 0.03);
            --rainbow: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #00ff00, #00f2ff, #9900ff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-dark); color: var(--white); overflow-x: hidden; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #splash-screen img { max-width: 400px; width: 85%; animation: zoomFade 5s infinite alternate; }

        /* Navigation */
        nav { 
            background: rgba(10,10,10,0.95); backdrop-filter: blur(15px);
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--neon-blue);
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 1.25rem; color: var(--neon-blue); cursor: pointer; }
        .nav-links { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-links li { cursor: pointer; transition: color 0.3s; font-size: 0.95rem; font-weight: 500; }
        .nav-links li:hover { color: var(--neon-blue); }
        
        /* Mobile Menu Toggle */
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; color: var(--neon-blue); }

        /* General Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .hidden { display: none !important; }
        
        /* Buttons & Inputs */
        .btn { padding: 12px 24px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; transition: 0.3s; font-size: 0.95rem; }
        .btn-neon { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .btn-neon:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .btn-red { background: var(--red); color: var(--white); }
        .btn-red:hover { opacity: 0.85; box-shadow: 0 0 15px var(--red); }
        .btn-orange { background: var(--orange); color: #000; }
        .btn-orange:hover { opacity: 0.85; box-shadow: 0 0 15px var(--orange); }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: var(--glass); border: 1px solid var(--grey); color: var(--white); border-radius: 6px; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-blue); outline: none; box-shadow: 0 0 10px rgba(0,242,255,0.3); }

        /* Hero Section */
        .hero { 
            min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            position: relative; overflow: hidden; padding: 20px;
        }
        .hero-bg { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0.35; z-index: -1; }
        .hero h1 { font-size: 3.2rem; margin: 20px 0; background: var(--rainbow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1px; }
        .hero p { font-size: 1.3rem; color: var(--grey); letter-spacing: 3px; font-weight: 600; }

        /* Store Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .product-card { background: rgba(255,255,255,0.02); border: 1px solid var(--grey); border-radius: 8px; padding: 20px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { border-color: var(--neon-blue); transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,242,255,0.1); }
        .product-card img { width: 100%; height: 210px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }

        /* Music & BGM Universe */
        .bgm-hero { display: flex; gap: 40px; align-items: center; background: rgba(255,255,255,0.02); padding: 40px; border-radius: 12px; border: 1px solid var(--neon-blue); margin-bottom: 30px; }
        .music-player-box { background: rgba(0,0,0,0.85); padding: 25px; border-radius: 10px; border: 1px solid var(--orange); margin-top: 25px; }

        /* Founder Section */
        .founder-box { display: flex; gap: 40px; align-items: center; background: rgba(255,255,255,0.02); padding: 40px; border-radius: 12px; border: 1px solid var(--red); box-shadow: 0 0 30px rgba(255,0,60,0.05); }
        .founder-box img { width: 260px; height: 260px; object-fit: cover; border-radius: 50%; border: 3px solid var(--red); box-shadow: 0 0 20px var(--red); }

        /* Footer */
        footer { background: #050505; text-align: center; padding: 40px 20px; border-top: 1px solid var(--grey); margin-top: 60px; color: var(--grey); }
        footer a { color: var(--neon-blue); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @keyframes zoomFade { 
            0% { transform: scale(1); opacity: 0.8; } 
            100% { transform: scale(1.08); opacity: 1; } 
        }
        
        @media(max-width: 768px) {
            .hero h1 { font-size: 2.1rem; }
            .founder-box, .bgm-hero { flex-direction: column; text-align: center; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: rgba(10,10,10,0.98); padding: 20px; border-bottom: 1px solid var(--neon-blue); }
            .nav-links.active { display: flex; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <img src="file_0000000028fc81f8b878489375475bad.png" alt="7Leo Splash">
    </div>

    <!-- 2. NAVIGATION -->
    <nav>
        <div class="nav-brand" onclick="router('home')">
            <img src="logo.png" style="width:38px; height:38px; object-fit:contain;" alt="7Leo Logo"> 7Leo Group
        </div>
        <div class="menu-toggle" onclick="toggleMobileMenu()">☰</div>
        <ul class="nav-links" id="nav-links-menu">
            <li onclick="router('home'); closeMenu()">Home</li>
            <li onclick="router('store'); closeMenu()">7Leo Store</li>
            <li onclick="router('bgm'); closeMenu()">7Leo BGM</li>
            <li onclick="router('founder'); closeMenu()">Founder</li>
            <li onclick="router('about'); closeMenu()">About</li>
            <li onclick="router('qr'); closeMenu()">Install App & QR</li>
            <li onclick="router('cart'); closeMenu()">Cart (<span id="cart-count">0</span>)</li>
            <li onclick="router('account'); closeMenu()" id="nav-account">Account</li>
            <li onclick="router('admin'); closeMenu()" id="nav-admin" class="hidden" style="color: var(--orange); font-weight: bold;">Super Admin</li>
        </ul>
    </nav>

    <!-- 3. MAIN DYNAMIC APP CONTAINER -->
    <main id="app">
        <!-- Dynamic Views Injected via JS Router -->
    </main>

    <!-- 4. FOOTER -->
    <footer>
        <p style="font-weight: bold; letter-spacing: 2px;">VISION * POWER * LEGACY</p>
        <p style="margin: 12px 0;"><a href="https://www.youtube.com/@7LeoBGM" target="_blank">Official YouTube Channel: @7LeoBGM</a></p>
        <p>© 2026 7Leo Group Commerce. Shop. Create. Explore. All rights reserved.</p>
    </footer>

    <!-- 5. COMPLETE CLIENT-SIDE LOGIC & ROUTER -->
    <script>
        // State Management & LocalStorage Initialization
        const state = {
            route: 'home',
            user: JSON.parse(localStorage.getItem('7leo_user')) || null,
            cart: JSON.parse(localStorage.getItem('7leo_cart')) || [],
            products: JSON.parse(localStorage.getItem('7leo_products')) || [
                { id: 1, title: '7Leo Futuristic Hoodie', price: 99.00, category: 'Fashion', image: 'logo.png', stock: 15 },
                { id: 2, title: 'GroovePad Audio Pro', price: 149.00, category: 'Tech', image: 'bgm-logo.png', stock: 8 },
                { id: 3, title: 'Vision Legacy Cap', price: 39.00, category: 'Fashion', image: 'logo.png', stock: 25 }
            ],
            tracks: JSON.parse(localStorage.getItem('7leo_tracks')) || [
                { id: 1, title: 'Drive Vibes #1', series: '7Leo Drive Series', duration: '3:45' },
                { id: 2, title: 'Cyber Chill Session', series: '7Leo Chill Series', duration: '4:20' },
                { id: 3, title: 'Street Energy Anthem', series: '7Leo Gangster Series', duration: '3:10' }
            ],
            licensingRequests: JSON.parse(localStorage.getItem('7leo_requests')) || []
        };

        window.toggleMobileMenu = () => { document.getElementById('nav-links-menu').classList.toggle('active'); };
        window.closeMenu = () => { document.getElementById('nav-links-menu').classList.remove('active'); };
        window.router = (path) => { state.route = path; render(); window.scrollTo(0, 0); };

        const render = () => {
            const app = document.getElementById('app');
            updateNavAuth();
            
            switch(state.route) {
                case 'home':
                    app.innerHTML = `
                        <section class="hero">
                            <img src="file_00000000776081fa8dbc514074356775.png" class="hero-bg" alt="Tattoo Background">
                            <img src="logo.png" style="width:150px; margin-bottom: 20px;" alt="Logo">
                            <h1>WELCOME TO 7LEO GROUP COMMERCE</h1>
                            <p>VISION * POWER * LEGACY</p>
                            <div style="margin-top: 35px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                                <button class="btn btn-neon" onclick="router('store')">Explore Store</button>
                                <button class="btn btn-orange" onclick="router('bgm')">Explore Music</button>
                            </div>
                        </section>`;
                    break;

                case 'store':
                    app.innerHTML = `
                        <div class="container">
                            <div style="display:flex; align-items:center; gap:20px; margin-bottom:25px; flex-wrap:wrap;">
                                <img src="file_00000000f2948207a9d90f38705cd83d.png" style="width:90px; height:90px; object-fit:contain;" alt="Store Logo">
                                <div>
                                    <h2>7Leo Store</h2>
                                    <p style="color:var(--grey)">Premium modern e-commerce platform connecting fashion and tech.</p>
                                </div>
                            </div>
                            <input type="text" id="search-bar" placeholder="Search products..." oninput="filterProducts(this.value)">
                            <div class="product-grid" id="product-container">
                                ${state.products.map(p => `
                                    <div class="product-card">
                                        <div>
                                            <img src="${p.image}" alt="${p.title}">
                                            <h3>${p.title}</h3>
                                            <p style="color:var(--neon-blue); margin: 12px 0; font-size:1.1rem; font-weight:bold;">$${p.price.toFixed(2)}</p>
                                        </div>
                                        <button class="btn btn-neon" style="width:100%; margin-top:10px;" onclick="addToCart(${p.id})">Add to Cart</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    break;

                case 'bgm':
                    app.innerHTML = `
                        <div class="container">
                            <div class="bgm-hero">
                                <img src="bgm-logo.png" style="width:130px; height:130px; object-fit:contain;" alt="BGM Logo">
                                <div>
                                    <img src="bgm-banner.png" style="max-width:100%; height:auto; margin-bottom:15px; border-radius:8px;" alt="BGM Banner">
                                    <h2>7LEO BGM</h2>
                                    <p style="color:var(--grey)">Mobile. Composed. GroovePad Music.</p>
                                    <p style="margin: 10px 0; font-size: 0.95rem; line-height: 1.5; color: #ccc;">Drive • Chill • Gangster • DJ • Cinematic. Handcrafted instrumental background music to fuel your focus.</p>
                                    <div style="margin-top:20px; display:flex; gap:15px; flex-wrap:wrap;">
                                        <button class="btn btn-neon" onclick="window.open('https://www.youtube.com/@7LeoBGM', '_blank')">Visit YouTube</button>
                                    </div>
                                </div>
                            </div>

                            <h3>Featured Playlists & Series</h3>
                            <ul style="list-style:none; margin-top:20px; display:grid; gap:15px;">
                                ${state.tracks.map(t => `
                                    <li style="background:rgba(255,255,255,0.02); padding:18px; border:1px solid var(--grey); border-radius:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                                        <div>
                                            <strong style="font-size:1.05rem;">${t.title}</strong>
                                            <div style="font-size:0.85rem; color:var(--grey); margin-top:4px;">${t.series} — Duration: ${t.duration}</div>
                                        </div>
                                        <button class="btn btn-red" onclick="alert('Playing track: ${t.title}')">Play Track</button>
                                    </li>
                                `).join('')}
                            </ul>

                            <div style="margin-top:50px; background:rgba(255,255,255,0.02); border:1px solid var(--orange); padding:30px; border-radius:10px;">
                                <h3>Music Licensing & Purchase</h3>
                                <p style="margin:15px 0; color:var(--grey); line-height:1.6;">Need music for your project? 7Leo BGM music can be considered for selected creative projects such as promotional videos, ads, trailers, short films, and brand campaigns.</p>
                                
                                <form onsubmit="handleMusicRequest(event)" style="margin-top:20px;">
                                    <input type="text" id="req-name" placeholder="Your Name" required>
                                    <input type="email" id="req-email" placeholder="Your Email Address" required>
                                    <select id="req-type">
                                        <option value="Commercial License">Commercial License</option>
                                        <option value="Music Purchase">Music Purchase</option>
                                        <option value="Advertisement">Advertisement / Promo Video</option>
                                        <option value="Trailer">Trailer / Short Film</option>
                                        <option value="Social Media">Social Media Project</option>
                                    </select>
                                    <textarea id="req-msg" placeholder="Describe your project details..." rows="3" required></textarea>
                                    <button type="submit" class="btn btn-orange" style="margin-top:10px;">Send Music Request</button>
                                </form>
                            </div>
                        </div>`;
                    break;

                case 'founder':
                    app.innerHTML = `
                        <div class="container">
                            <div class="founder-box">
                                <img src="founder.jpg" alt="AbuBakker Bellary">
                                <div>
                                    <h2>MEET THE FOUNDER & CEO</h2>
                                    <h3 style="color:var(--neon-blue); margin: 10px 0;">ABUBAKKER BELLARY</h3>
                                    <p style="color:var(--grey); margin-bottom: 15px;">Karnataka State | Hospet – 583201 | Vijayanagara Zilla</p>
                                    <p style="line-height:1.7;">This website was built entirely on a mobile phone — with no friends, no team support, and no investors. Just a solo founder with a vision, dedication, and the determination to build something meaningful from the ground up.</p>
                                    <p style="margin-top:20px; font-weight:bold; color:var(--orange); font-size:1.1rem;">Built solo. Dreamed big.</p>
                                </div>
                            </div>
                        </div>`;
                    break;

                case 'about':
                    app.innerHTML = `
                        <div class="container" style="text-align:center; max-width:850px;">
                            <h2>About 7Leo Group Commerce</h2>
                            <p style="margin:25px 0; line-height:1.8; color:var(--grey); font-size:1.1rem;">7Leo Group Commerce is a modern digital commerce platform focused on bringing shopping, fashion, creativity, and digital services together in one place. Our goal is to build a simple, innovative, and user-friendly experience for everyone.</p>
                            <p style="font-size:1.3rem; color:var(--neon-blue); font-weight:bold;">Shop. Create. Explore.</p>
                        </div>`;
                    break;

                case 'qr':
                    app.innerHTML = `
                        <div class="container" style="text-align:center; max-width:600px;">
                            <h2>Scan & Enter 7Leo Group Commerce</h2>
                            <p style="color:var(--grey); margin:15px 0;">Take 7Leo Group Commerce with you everywhere.</p>
                            
                            <div style="background:rgba(255,255,255,0.03); padding:30px; border:1px solid var(--neon-blue); border-radius:10px; margin:25px 0;">
                                <div id="qrcode-box" style="margin-bottom:20px;">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(window.location.href) alt="Dynamic QR Code" style="background:#fff; padding:10px; border-radius:6px;">
                                </div>
                                <p style="word-break:break-all; font-size:0.9rem; color:var(--neon-blue);">${window.location.href}</p>
                            </div>

                            <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
                                <button class="btn btn-neon" onclick="navigator.clipboard.writeText(window.location.href); alert('Website link copied to clipboard!');">Copy Website Link</button>
                                <button class="btn btn-orange" onclick="alert('To Install: Open browser menu (⋮ or Share) and select Add to Home Screen or Install App.')">Install App PWA</button>
                            </div>
                        </div>`;
                    break;

                case 'cart':
                    const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                    app.innerHTML = `
                        <div class="container" style="max-width:800px;">
                            <h2>Shopping Cart</h2>
                            ${state.cart.length === 0 ? '<p style="margin-top:20px; color:var(--grey);">Your cart is currently empty.</p>' : `
                                <div style="margin-top:25px;">
                                    ${state.cart.map(i => `
                                        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid var(--grey); flex-wrap:wrap; gap:10px;">
                                            <div>
                                                <strong>${i.title}</strong>
                                                <div style="color:var(--grey); font-size:0.9rem;">Price: $${i.price.toFixed(2)} × ${i.qty}</div>
                                            </div>
                                            <div style="display:flex; align-items:center; gap:15px;">
                                                <span style="font-weight:bold; color:var(--neon-blue);">$${(i.price * i.qty).toFixed(2)}</span>
                                                <button class="btn btn-red" style="padding:6px 12px; font-size:0.85rem;" onclick="removeFromCart(${i.id})">Remove</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                    <div style="margin-top:25px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
                                        <h3>Total Amount: $${total.toFixed(2)}</h3>
                                        <button class="btn btn-orange" onclick="alert('Checkout payment configuration pending setup.')">Proceed to Checkout</button>
                                    </div>
                                </div>
                            `}
                        </div>`;
                    break;

                case 'account':
                    if (state.user) {
                        app.innerHTML = `
                            <div class="container" style="max-width:500px;">
                                <h2>Account Dashboard</h2>
                                <div style="background:rgba(255,255,255,0.02); padding:25px; border:1px solid var(--grey); border-radius:8px; margin-top:20px;">
                                    <p style="margin-bottom:15px;">Logged in as: <strong>${state.user.email}</strong></p>
                                    <p style="margin-bottom:20px; color:var(--grey);">Role: <strong>${state.user.role}</strong></p>
                                    <button class="btn btn-red" onclick="logout()">Sign Out</button>
                                </div>
                            </div>`;
                    } else {
                        app.innerHTML = `
                            <div class="container" style="max-width:420px;">
                                <h2>Sign In to 7Leo</h2>
                                <form onsubmit="handleLogin(event)" style="margin-top:20px;">
                                    <input type="email" id="login-email" placeholder="Email address" required>
                                    <input type="password" id="login-password" placeholder="Password" required>
                                    <button type="submit" class="btn btn-neon" style="width:100%; margin-top:15px;">SIGN IN</button>
                                </form>
                                <p style="margin-top:20px; font-size:0.85rem; color:var(--grey); text-align:center;">Super Admin login: <strong>7leogroup@gmail.com</strong></p>
                            </div>`;
                    }
                    break;

                case 'admin':
                    if (state.user?.email === '7leogroup@gmail.com') {
                        app.innerHTML = `
                            <div class="container">
                                <h2 style="color:var(--orange);">Super Admin Dashboard</h2>
                                <p style="color:var(--grey); margin-bottom:25px;">Welcome back, Super Admin. Full management access granted.</p>
                                
                                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:25px;">
                                    <div style="background:rgba(255,255,255,0.02); padding:25px; border:1px solid var(--grey); border-radius:8px;">
                                        <h3>Add New Product</h3>
                                        <input type="text" id="new-prod-name" placeholder="Product Title">
                                        <input type="number" id="new-prod-price" placeholder="Price ($)">
                                        <button class="btn btn-neon" style="margin-top:12px;" onclick="addAdminProduct()">Save Product</button>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.02); padding:25px; border:1px solid var(--grey); border-radius:8px;">
                                        <h3>Protected Official Assets</h3>
                                        <p style="font-size:0.9rem; color:var(--grey); margin-top:10px; line-height:1.5;">All 7 official brand assets are secured against deletion or public overwrites in this runtime instance.</p>
                                        <p style="margin-top:15px; color:var(--orange); font-size:0.85rem;">Licensing Requests Received: <strong>${state.licensingRequests.length}</strong></p>
                                    </div>
                                </div>
                            </div>`;
                    } else {
                        app.innerHTML = `<div class="container"><h2>Access Denied</h2><p style="margin-top:15px; color:var(--grey);">You do not have Super Admin permissions to view this area.</p></div>`;
                    }
                    break;

                default:
                    app.innerHTML = `<div class="container"><h2>Page not found</h2></div>`;
            }
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            state.user = { email, role: email === '7leogroup@gmail.com' ? 'SUPER_ADMIN' : 'VISITOR' };
            localStorage.setItem('7leo_user', JSON.stringify(state.user));
            router('account');
        };

        window.logout = () => {
            state.user = null;
            localStorage.removeItem('7leo_user');
            router('home');
        };

        window.addToCart = (id) => {
            const product = state.products.find(p => p.id === id);
            const existing = state.cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({ ...product, qty: 1 });
            }
            localStorage.setItem('7leo_cart', JSON.stringify(state.cart));
            updateNavAuth();
            alert('Product added to cart successfully!');
        };

        window.removeFromCart = (id) => {
            state.cart = state.cart.filter(item => item.id !== id);
            localStorage.setItem('7leo_cart', JSON.stringify(state.cart));
            render();
        };

        window.addAdminProduct = () => {
            const name = document.getElementById('new-prod-name').value;
            const price = parseFloat(document.getElementById('new-prod-price').value);
            if (!name || isNaN(price)) return alert('Please enter valid product details.');
            state.products.push({ id: Date.now(), title: name, price, category: 'General', image: 'logo.png', stock: 10 });
            localStorage.setItem('7leo_products', JSON.stringify(state.products));
            alert('Product added successfully!');
            render();
        };

        window.handleMusicRequest = (e) => {
            e.preventDefault();
            const name = document.getElementById('req-name').value;
            const email = document.getElementById('req-email').value;
            const type = document.getElementById('req-type').value;
            const msg = document.getElementById('req-msg').value;
            
            state.licensingRequests.push({ name, email, type, msg, date: new Date().toLocaleString() });
            localStorage.setItem('7leo_requests', JSON.stringify(state.licensingRequests));
            alert('Music licensing request submitted successfully!');
            e.target.reset();
        };

        window.filterProducts = (query) => {
            const container = document.getElementById('product-container');
            const filtered = state.products.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));
            container.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div>
                        <img src="${p.image}" alt="${p.title}">
                        <h3>${p.title}</h3>
                        <p style="color:var(--neon-blue); margin: 12px 0; font-size:1.1rem; font-weight:bold;">$${p.price.toFixed(2)}</p>
                    </div>
                    <button class="btn btn-neon" style="width:100%; margin-top:10px;" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('') || '<p style="grid-column:1/-1; text-align:center; color:var(--grey);">No products found.</p>';
        };

        const updateNavAuth = () => {
            const totalCount = state.cart.reduce((a, c) => a + c.qty, 0);
            const cartSpan = document.getElementById('cart-count');
            if (cartSpan) cartSpan.innerText = totalCount;
            
            const adminLink = document.getElementById('nav-admin');
            if (adminLink) {
                if (state.user?.email === '7leogroup@gmail.com') {
                    adminLink.classList.remove('hidden');
                } else {
                    adminLink.classList.add('hidden');
                }
            }
        };

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 1000);
                }
            }, 5000);
            render();
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `)).catch(() => {});
            });
        }
    </script>
</body>
</html>
