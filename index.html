<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Leo Group Commerce | Vision, Power, Legacy</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --white: #ffffff;
            --neon-blue: #00f2ff;
            --red: #ff003c;
            --orange: #ff9900;
            --grey: #808080;
            --glass: rgba(255, 255, 255, 0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: var(--white); }
        .hidden { display: none !important; }
        nav { padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--neon-blue); }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links li { cursor: pointer; color: var(--white); }
        .btn { padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-neon { background: var(--neon-blue); color: #000; }
        .btn-red { background: var(--red); color: #fff; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .hero { text-align: center; padding: 100px 20px; border-bottom: 1px solid var(--grey); }
        .card { background: var(--glass); padding: 20px; border: 1px solid var(--grey); border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid var(--grey); color: #fff; }
    </style>
</head>
<body>

<nav>
    <div onclick="router('home')" style="cursor:pointer; font-weight:bold; font-size:1.5rem;">7LEO</div>
    <ul class="nav-links">
        <li onclick="router('home')">Home</li>
        <li onclick="router('store')">Store</li>
        <li onclick="router('bgm')">BGM</li>
        <li onclick="router('account')">Account</li>
    </ul>
</nav>

<main id="app">
    <!-- Router Injects Content Here -->
</main>

<script>
    const state = {
        route: 'home',
        user: null, // Will hold user data
        cart: [],
        products: [
            { id: 1, name: '7Leo Hoodie', price: 99, img: 'logo.png' },
            { id: 2, name: 'GroovePad Pro', price: 149, img: 'bgm-logo.png' }
        ],
        licensingRequests: []
    };

    const router = (path) => {
        state.route = path;
        render();
    };

    const render = () => {
        const app = document.getElementById('app');
        app.innerHTML = '';
        
        if (state.route === 'home') {
            app.innerHTML = `
                <div class="hero">
                    <h1>WELCOME TO 7LEO GROUP COMMERCE</h1>
                    <p>VISION * POWER * LEGACY</p>
                </div>
                <div class="container">
                    <section class="card">
                        <h3>Meet the Founder</h3>
                        <img src="founder.jpg" style="width:100px; border-radius:50%;" alt="Founder">
                        <p><strong>ABUBAKKER BELLARY</strong></p>
                        <p>Hospet, Karnataka, 583201</p>
                        <p>This website was built entirely on a mobile phone — with no friends, no team support, and no investors. Just a solo founder with a vision.</p>
                    </section>
                    <section class="card">
                        <h3>About 7Leo Group Commerce</h3>
                        <p>A modern digital commerce platform connecting shopping, fashion, and digital services. Shop. Create. Explore.</p>
                    </section>
                    <section class="card">
                        <img src="file_00000000f2948207a9d90f38705cd83d.png" style="width:50px;">
                        <h3>7Leo Store</h3>
                        <button class="btn btn-neon" onclick="router('store')">Enter 7Leo Store</button>
                    </section>
                    <section class="card">
                        <img src="bgm-logo.png" style="width:50px;">
                        <h3>7Leo BGM</h3>
                        <button class="btn btn-neon" onclick="router('bgm')">Explore BGM</button>
                    </section>
                </div>
            `;
        } else if (state.route === 'store') {
            app.innerHTML = `
                <div class="container">
                    <h2>7Leo Store</h2>
                    <div class="grid">
                        ${state.products.map(p => `
                            <div class="card">
                                <img src="${p.img}" style="width:100px;">
                                <h4>${p.name}</h4>
                                <p>$${p.price}</p>
                                <button class="btn btn-neon" onclick="addToCart(${p.id})">Add to Cart</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        } else if (state.route === 'bgm') {
            app.innerHTML = `
                <div class="container">
                    <img src="bgm-banmer.png" style="width:100%; height:200px; object-fit:cover;">
                    <h2>7Leo BGM Music World</h2>
                    <button class="btn btn-red" onclick="window.open('https://www.youtube.com/@7LeoBGM')">WATCH ON YOUTUBE</button>
                    
                    <div class="card" style="margin-top:20px;">
                        <h3>Music Licensing Inquiry</h3>
                        <form onsubmit="submitLicense(event)">
                            <input type="text" placeholder="Name" required>
                            <input type="email" placeholder="Email" required>
                            <select><option>Advertisement</option><option>Trailer</option><option>Shorts</option></select>
                            <textarea placeholder="Message"></textarea>
                            <button type="submit" class="btn btn-neon">SEND LICENSING REQUEST</button>
                        </form>
                    </div>
                </div>
            `;
        } else if (state.route === 'account') {
            app.innerHTML = `
                <div class="container">
                    <h2>Account</h2>
                    ${state.user ? `<p>Logged in as: ${state.user.email}</p>` : `
                        <div class="card">
                            <button class="btn btn-neon" onclick="alert('Configuration Required: OAuth Setup')">Sign In with Google</button>
                            <button class="btn btn-neon" onclick="alert('Configuration Required: Apple Auth Setup')">Sign In with Apple</button>
                        </div>
                    `}
                    ${state.user?.email === '7leogroup@gmail.com' ? `<div class="card"><h3>Admin Controls</h3><p>Manage Products Here</p></div>` : ''}
                </div>
            `;
        }
    };

    // Placeholder functions to prevent breakage
    window.addToCart = (id) => alert('Product added. Checkout configuration required.');
    window.submitLicense = (e) => { e.preventDefault(); alert('Inquiry stored. Email backend configuration required.'); };

    // Initial Load
    render();
</script>

</body>
</html>
