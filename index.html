<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Leo Group | Global Enterprise & E-Commerce Hub</title>
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-card: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
            --electric-blue: #00f0ff;
            --border-color: #262626;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .logo-area img {
            height: 40px;
            width: 40px;
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid var(--gold);
        }
        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-link {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--gold);
        }
        .cart-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .store-tab-content {
            display: none;
        }
        .store-tab-content.active {
            display: block;
        }
        .catalog-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .catalog-controls input, .catalog-controls select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }
        .catalog-controls input {
            flex: 1;
            min-width: 220px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-dark);
        }
        .product-card-img-wrap {
            width: 100%;
            height: 180px;
            background: #1a1a1a;
            overflow: hidden;
        }
        .product-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .product-card-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .product-card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card-actions {
            display: flex;
            gap: 8px;
        }
        .submit-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: var(--gold-light);
        }
        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .action-btn:hover {
            border-color: var(--gold);
        }
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer;
        }
        .dashboard-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .metric-card h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .metric-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        th {
            background: #1c1c1c;
            color: var(--gold-light);
        }
        .image-preview-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .image-preview-thumb {
            width: 60px; height: 60px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .image-preview-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo-area" onclick="switchStoreTab('catalog')">
                <img src="logo.png" alt="7Leo Group Logo" onerror="this.src='https://via.placeholder.com/40'">
                <span class="logo-text">7LEO GROUP</span>
            </div>
            <div class="nav-links">
                <button class="nav-link active" onclick="switchStoreTab('catalog')">Catalog</button>
                <button class="nav-link" onclick="switchStoreTab('tracking')">Track Order</button>
                <button class="nav-link" onclick="switchStoreTab('dashboard')">Owner Dashboard</button>
                <button class="cart-btn" onclick="switchStoreTab('cart')">
                    Cart (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- Catalog Tab -->
        <div id="tab-catalog" class="store-tab-content active">
            <div class="catalog-controls">
                <input type="text" id="store-search" placeholder="Search 7Leo products..." oninput="filterStoreProducts()">
                <select id="store-category-filter" onchange="filterStoreProducts()">
                    <option value="">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Apparel">Apparel</option>
                    <option value="Digital & Software">Digital & Software</option>
                </select>
                <select id="store-sort" onchange="filterStoreProducts()">
                    <option value="newest">Sort by: Newest</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
                <button class="submit-btn" style="width: auto; padding: 10px 20px;" onclick="openAddProductForm()">+ Add Product</button>
            </div>
            <div class="product-grid" id="store-product-grid">
                <!-- Products dynamically rendered here -->
            </div>
        </div>

        <!-- Cart Tab -->
        <div id="tab-cart" class="store-tab-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;">Shopping Cart</h2>
            <div id="cart-items-container"></div>
            <div id="cart-summary-footer" style="margin-top: 20px; display: none;">
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--gold); margin-bottom: 15px;" id="cart-total-display">Total: ₹0</div>
                <button class="submit-btn" onclick="proceedToCheckout()" style="max-width: 300px;">Proceed to Checkout</button>
            </div>
        </div>

        <!-- Checkout Tab -->
        <div id="tab-checkout" class="store-tab-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;">Secure Checkout</h2>
            <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)" style="max-width: 600px; display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Full Name</label>
                    <input type="text" id="cust-name" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Email Address</label>
                    <input type="email" id="cust-email" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Phone Number</label>
                    <input type="tel" id="cust-phone" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Shipping Address</label>
                    <textarea id="cust-address" required rows="3" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;"></textarea>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Payment Gateway</label>
                    <select id="payment-provider" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                        <option value="Razorpay">Razorpay / UPI / Credit Card</option>
                        <option value="Stripe">Stripe Global Card</option>
                        <option value="COD">Cash on Delivery</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" style="margin-top: 10px;">Place Secure Order</button>
            </form>
        </div>

        <!-- Tracking Tab -->
        <div id="tab-tracking" class="store-tab-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;">Order Tracking</h2>
            <div style="display: flex; gap: 10px; max-width: 500px; margin-bottom: 20px;">
                <input type="text" id="tracking-search-input" placeholder="Enter Order ID (e.g. 7LEO-1001)" style="flex:1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                <button class="submit-btn" style="width: auto;" onclick="trackOrderQuery()">Track</button>
            </div>
            <div id="tracking-result-box" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; max-width: 500px; display: none;"></div>
        </div>

        <!-- Owner Dashboard Tab -->
        <div id="tab-dashboard" class="store-tab-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;">7Leo Owner Dashboard</h2>
            <div class="dashboard-metrics">
                <div class="metric-card">
                    <h4>Total Orders</h4>
                    <div class="value" id="metric-orders">0</div>
                </div>
                <div class="metric-card">
                    <h4>Total Sales</h4>
                    <div class="value" id="metric-sales">₹0</div>
                </div>
                <div class="metric-card">
                    <h4>Estimated Profit</h4>
                    <div class="value" id="metric-profit">₹0</div>
                </div>
                <div class="metric-card">
                    <h4>Pending Fulfillment</h4>
                    <div class="value" id="metric-pending">0</div>
                </div>
            </div>
            <h3 style="color: var(--text-light); margin-bottom: 15px;">Recent Orders</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Item</th>
                            <th>Total</th>
                            <th>Profit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-orders-tbody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Product Form Tab -->
        <div id="tab-product-form" class="store-tab-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;" id="product-form-heading">Add New Product</h2>
            <form id="product-management-form" onsubmit="handleSaveProduct(event)" style="max-width: 600px; display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" id="edit-product-id">
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Product Name</label>
                    <input type="text" id="prod-name" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Description</label>
                    <textarea id="prod-desc" required rows="3" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;"></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex:1;">
                        <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Category</label>
                        <select id="prod-category" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                            <option value="Electronics">Electronics</option>
                            <option value="Apparel">Apparel</option>
                            <option value="Digital & Software">Digital & Software</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">SKU</label>
                        <input type="text" id="prod-sku" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                    </div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex:1;">
                        <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Cost Price (₹)</label>
                        <input type="number" id="prod-cost" oninput="calculateRealtimeProfit()" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                    </div>
                    <div style="flex:1;">
                        <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Selling Price (₹)</label>
                        <input type="number" id="prod-price" oninput="calculateRealtimeProfit()" required style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                    </div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex:1;">
                        <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Estimated Fees/Shipping (₹)</label>
                        <input type="number" id="prod-fees" oninput="calculateRealtimeProfit()" value="0" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                    </div>
                    <div style="flex:1; display:flex; align-items:flex-end;">
                        <div id="live-profit-calc-text" style="color: var(--gold); font-size: 0.9rem; font-weight: 600; padding-bottom: 10px;">Estimated Profit: ₹0</div>
                    </div>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Supplier Name / Link</label>
                    <input type="text" id="prod-supplier" placeholder="e.g. AliExpress / CJ Dropshipping" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px; margin-bottom: 8px;">
                    <input type="url" id="prod-supplier-url" placeholder="https://supplier-product-link.com" style="width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; color: var(--text-muted);">Product Images</label>
                    <input type="file" id="prod-images-input" multiple accept="image/*" onchange="handleImageUpload(event)" style="color: var(--text-muted);">
                    <div class="image-preview-container" id="image-preview-container"></div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="submit-btn">Save & Publish Product</button>
                    <button type="button" class="action-btn" onclick="switchStoreTab('catalog')">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div class="modal-backdrop" id="product-detail-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('product-detail-modal')">&times;</button>
            <div id="product-detail-body"></div>
        </div>
    </div>

    <script>
        // Data States
        let storeProducts = JSON.parse(localStorage.getItem('7leo_products')) || [
            {
                id: 'prod_1',
                name: 'Quantum Smart Ring',
                description: 'Advanced health tracking, contactless payments, and sleek ceramic titanium build.',
                category: 'Electronics',
                sku: '7L-QR-001',
                cost: 2500,
                price: 7999,
                fees: 200,
                supplier: 'Global Tech Wholesale',
                supplierUrl: '',
                images: ['https://images.unsplash.com/photo-1622434641406-a158123450f9?w=500&auto=format&fit=crop&q=60']
            },
            {
                id: 'prod_2',
                name: '7Leo Executive Hoodie',
                description: 'Premium heavy cotton blend with custom gold embroidery and minimalist styling.',
                category: 'Apparel',
                sku: '7L-APP-002',
                cost: 800,
                price: 2499,
                fees: 150,
                supplier: 'Apex Apparel Co.',
                supplierUrl: '',
                images: ['https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&auto=format&fit=crop&q=60']
            }
        ];

        let cart = JSON.parse(localStorage.getItem('7leo_cart')) || [];
        let orders = JSON.parse(localStorage.getItem('7leo_orders')) || [];
        let currentUploadedImages = ['logo.png'];

        // Initialization
        window.onload = function() {
            renderStoreCatalog();
            updateCartCount();
        };

        function saveStoreData() {
            localStorage.setItem('7leo_products', JSON.stringify(storeProducts));
            localStorage.setItem('7leo_cart', JSON.stringify(cart));
            localStorage.setItem('7leo_orders', JSON.stringify(orders));
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function switchStoreTab(tabName) {
            document.querySelectorAll('.store-tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));

            if(tabName === 'catalog') { document.getElementById('tab-catalog').classList.add('active'); }
            if(tabName === 'cart') { document.getElementById('tab-cart').classList.add('active'); renderCart(); }
            if(tabName === 'checkout') { document.getElementById('tab-checkout').classList.add('active'); }
            if(tabName === 'tracking') { document.getElementById('tab-tracking').classList.add('active'); }
            if(tabName === 'dashboard') { document.getElementById('tab-dashboard').classList.add('active'); renderAdminDashboard(); }
            if(tabName === 'product-form') { document.getElementById('tab-product-form').classList.add('active'); }
        }

        function renderStoreCatalog() {
            const grid = document.getElementById('store-product-grid');
            if(!grid) return;
            const search = document.getElementById('store-search')?.value.toLowerCase() || '';
            const category = document.getElementById('store-category-filter')?.value || '';
            const sort = document.getElementById('store-sort')?.value || 'newest';

            let filtered = storeProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                const matchesCat = category === '' || p.category === category;
                return matchesSearch && matchesCat;
            });

            if(sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
            if(sort === 'price-high') filtered.sort((a,b) => b.price - a.price);

            grid.innerHTML = '';
            if(filtered.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:40px;">No products found.</p>';
                return;
            }

            filtered.forEach(p => {
                const img = p.images && p.images.length > 0 ? p.images[0] : 'logo.png';
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-card-img-wrap" onclick="viewProductDetails('${p.id}')" style="cursor:pointer;">
                            <img src="${img}" alt="${p.name}">
                        </div>
                        <div class="product-card-info">
                            <h4 class="product-card-title" onclick="viewProductDetails('${p.id}')" style="cursor:pointer;">${p.name}</h4>
                            <div class="product-card-price">₹${p.price.toLocaleString('en-IN')}</div>
                            <p class="product-card-desc">${p.description}</p>
                            <div class="product-card-actions">
                                <button class="submit-btn" style="padding: 8px 12px; font-size:0.85rem;" onclick="addToCart('${p.id}')">Add to Cart</button>
                                <button class="action-btn" style="padding: 8px 12px; font-size:0.85rem;" onclick="viewProductDetails('${p.id}')">View</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterStoreProducts() {
            renderStoreCatalog();
        }

        function viewProductDetails(productId) {
            const p = storeProducts.find(item => item.id === productId);
            if(!p) return;
            const body = document.getElementById('product-detail-body');
            const img = p.images && p.images.length > 0 ? p.images[0] : 'logo.png';
            body.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div style="width: 100%; height: 250px; background: #222; border-radius: 8px; overflow: hidden;">
                        <img src="${img}" alt="${p.name}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <h3 style="color: var(--gold-light); font-size: 1.4rem;">${p.name}</h3>
                    <div style="color: var(--gold); font-size: 1.2rem; font-weight: 700;">₹${p.price.toLocaleString('en-IN')}</div>
                    <p style="color: var(--text-muted); line-height: 1.5;">${p.description}</p>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">SKU: ${p.sku} | Category: ${p.category}</div>
                    <button class="submit-btn" onclick="addToCart('${p.id}'); closeModal('product-detail-modal');">Add to Cart</button>
                </div>
            `;
            openModal('product-detail-modal');
        }

        function addToCart(productId) {
            const p = storeProducts.find(item => item.id === productId);
            if(!p) return;
            cart.push(p);
            saveStoreData();
            updateCartCount();
            alert(`"${p.name}" has been added to your cart.`);
        }

        function updateCartCount() {
            const badge = document.getElementById('cart-count');
            if(badge) badge.innerText = cart.length;
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const footer = document.getElementById('cart-summary-footer');
            if(!container) return;

            if(cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Your cart is empty.</p>';
                if(footer) footer.style.display = 'none';
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                container.innerHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.85); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333;">
                        <div>
                            <h4 style="color: var(--text-light); font-size: 1rem;">${item.name}</h4>
                            <p style="color: var(--gold); font-size: 0.95rem; font-weight: 600;">₹${item.price.toLocaleString('en-IN')}</p>
                        </div>
                        <button class="action-btn" style="border-color: #ff5555; color: #ff5555; padding: 6px 12px; font-size: 0.8rem;" onclick="removeFromCart(${idx})">Remove</button>
                    </div>
                `;
            });

            if(footer) {
                footer.style.display = 'block';
                document.getElementById('cart-total-display').innerText = `Total: ₹${total.toLocaleString('en-IN')}`;
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveStoreData();
            updateCartCount();
            renderCart();
        }

        function proceedToCheckout() {
            if(cart.length === 0) {
                alert('Your cart is empty.');
                return;
            }
            switchStoreTab('checkout');
        }

        function handleCheckoutSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const payment = document.getElementById('payment-provider').value;

            const orderId = '7LEO-' + Math.floor(1000 + Math.random() * 9000);
            let orderTotal = cart.reduce((sum, item) => sum + item.price, 0);
            let orderCost = cart.reduce((sum, item) => sum + (item.cost || 0), 0);
            let estProfit = orderTotal - orderCost;

            const newOrder = {
                orderId,
                name,
                email,
                phone,
                address,
                payment,
                items: [...cart],
                total: orderTotal,
                profit: estProfit,
                status: 'Processing',
                date: new Date().toLocaleDateString()
            };

            orders.push(newOrder);
            cart = [];
            saveStoreData();
            updateCartCount();

            alert(`Order placed successfully! Your Order ID is ${orderId}.`);
            switchStoreTab('tracking');
            document.getElementById('tracking-search-input').value = orderId;
            trackOrderQuery();
        }

        function trackOrderQuery() {
            const query = document.getElementById('tracking-search-input').value.trim();
            const box = document.getElementById('tracking-result-box');
            if(!query) return;

            const found = orders.find(o => o.orderId.toLowerCase() === query.toLowerCase());
            box.style.display = 'block';
            if(!found) {
                box.innerHTML = `<p style="color: #ff5555;">No order found with ID "${query}". Please check your Order ID.</p>`;
                return;
            }

            let itemsList = found.items.map(i => i.name).join(', ');
            box.innerHTML = `
                <h4 style="color: var(--gold); margin-bottom: 12px;">Order Status: ${found.orderId}</h4>
                <p style="color: var(--text-light); margin-bottom: 8px;"><strong>Customer:</strong> ${found.name}</p>
                <p style="color: var(--text-light); margin-bottom: 8px;"><strong>Items:</strong> ${itemsList}</p>
                <p style="color: var(--text-light); margin-bottom: 8px;"><strong>Total Amount:</strong> ₹${found.total.toLocaleString('en-IN')}</p>
                <p style="color: var(--text-light); margin-bottom: 8px;"><strong>Status:</strong> <span style="color: var(--electric-blue);">${found.status}</span></p>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 12px;">Fulfillment and shipping updates are processed through our global partner network.</p>
            `;
        }

        function openAddProductForm() {
            document.getElementById('product-management-form').reset();
            document.getElementById('edit-product-id').value = '';
            document.getElementById('product-form-heading').innerText = 'Add New Product';
            currentUploadedImages = ['logo.png'];
            document.getElementById('image-preview-container').innerHTML = `<div class="image-preview-thumb"><img src="logo.png"></div>`;
            switchStoreTab('product-form');
        }

        function calculateRealtimeProfit() {
            const cost = parseFloat(document.getElementById('prod-cost').value) || 0;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const fees = parseFloat(document.getElementById('prod-fees').value) || 0;
            const profit = price - cost - fees;
            const margin = price > 0 ? ((profit / price) * 100).toFixed(1) : 0;
            document.getElementById('live-profit-calc-text').innerText = `Estimated Profit: ₹${profit.toFixed(2)} (Margin: ${margin}%)`;
        }

        function handleImageUpload(e) {
            const files = e.target.files;
            currentUploadedImages = [];
            const previewContainer = document.getElementById('image-preview-container');
            previewContainer.innerHTML = '';

            for(let i=0; i<files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentUploadedImages.push(event.target.result);
                    previewContainer.innerHTML += `
                        <div class="image-preview-thumb">
                            <img src="${event.target.result}">
                        </div>
                    `;
                }
                reader.readAsDataURL(files[i]);
            }
        }

        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-product-id').value || 'prod_' + Date.now();
            const name = document.getElementById('prod-name').value;
            const description = document.getElementById('prod-desc').value;
            const category = document.getElementById('prod-category').value;
            const sku = document.getElementById('prod-sku').value;
            const cost = parseFloat(document.getElementById('prod-cost').value) || 0;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const fees = parseFloat(document.getElementById('prod-fees').value) || 0;
            const supplier = document.getElementById('prod-supplier').value;
            const supplierUrl = document.getElementById('prod-supplier-url').value;

            const productData = {
                id,
                name,
                description,
                category,
                sku,
                cost,
                price,
                fees,
                supplier,
                supplierUrl,
                images: currentUploadedImages.length > 0 ? currentUploadedImages : ['logo.png']
            };

            const existingIndex = storeProducts.findIndex(p => p.id === id);
            if(existingIndex >= 0) {
                storeProducts[existingIndex] = productData;
            } else {
                storeProducts.unshift(productData);
            }

            saveStoreData();
            renderStoreCatalog();
            switchStoreTab('catalog');
            alert('Product saved and published successfully!');
        }

        function renderAdminDashboard() {
            document.getElementById('metric-orders').innerText = orders.length;
            let totalSales = orders.reduce((sum, o) => sum + o.total, 0);
            let totalProfit = orders.reduce((sum, o) => sum + o.profit, 0);
            let pendingCount = orders.filter(o => o.status === 'Processing').length;

            document.getElementById('metric-sales').innerText = `₹${totalSales.toLocaleString('en-IN')}`;
            document.getElementById('metric-profit').innerText = `₹${totalProfit.toLocaleString('en-IN')}`;
            document.getElementById('metric-pending').innerText = pendingCount;

            const tbody = document.getElementById('admin-orders-tbody');
            if(!tbody) return;

            tbody.innerHTML = '';
            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No orders recorded yet.</td></tr>`;
                return;
            }

            orders.forEach(o => {
                let firstItemName = o.items.length > 0 ? o.items[0].name : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td>${o.orderId}</td>
                        <td>${o.name}</td>
                        <td>${firstItemName}</td>
                        <td>₹${o.total.toLocaleString('en-IN')}</td>
                        <td style="color: var(--gold);">₹${o.profit.toLocaleString('en-IN')}</td>
                        <td><span style="color: var(--electric-blue);">${o.status}</span></td>
                        <td>
                            <button class="action-btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="updateOrderStatus('${o.orderId}', 'Shipped')">Mark Shipped</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateOrderStatus(orderId, newStatus) {
            const order = orders.find(o => o.orderId === orderId);
            if(order) {
                order.status = newStatus;
                saveStoreData();
                renderAdminDashboard();
                alert(`Order ${orderId} status updated to ${newStatus}.`);
            }
        }
    </script>
</body>
</html>
